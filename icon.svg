<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#1c1916"/>
    </linearGradient>
    <!-- Top face of the cube: brightest, catches the "light" -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d9a8"/>
      <stop offset="100%" stop-color="#d9b874"/>
    </linearGradient>
    <!-- Left face: mid tone -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99a52"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <!-- Right face: darkest, in shadow -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c7238"/>
      <stop offset="100%" stop-color="#7a5626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bgGrad)"/>

  <!-- Isometric cube — universal symbol for "3D" -->
  <g transform="translate(100,102)">
    <!-- Top face (rhombus) -->
    <path d="M0,-56 L48,-28 L0,0 L-48,-28 Z" fill="url(#topFace)"/>
    <!-- Left face -->
    <path d="M-48,-28 L0,0 L0,56 L-48,28 Z" fill="url(#leftFace)"/>
    <!-- Right face -->
    <path d="M48,-28 L0,0 L0,56 L48,28 Z" fill="url(#rightFace)"/>

    <!-- Subtle edge lines for definition -->
    <g fill="none" stroke="#2a1f10" stroke-width="1.4" stroke-linejoin="round" opacity="0.5">
      <path d="M0,-56 L48,-28 L0,0 L-48,-28 Z"/>
      <path d="M-48,-28 L0,0 L0,56 L-48,28 Z"/>
      <path d="M48,-28 L0,0 L0,56 L48,28 Z"/>
    </g>

    <!-- Rotation arc, hinting at "viewer" / orbit controls -->
    <path d="M-66,10 A70,70 0 0 0 -40,54" fill="none" stroke="#f0d9a8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M-46,52 L-40,54 L-44,44" fill="none" stroke="#f0d9a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
